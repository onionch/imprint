[package]
name = "imprint"
version = "0.1.0"
description = "会务签到胸牌打印工具"
authors = ["you"]
license = "MIT"
repository = "https://github.com/onionch/imprint"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "checkin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Excel import
calamine = "0.26"

# JSON handling
serde_derive = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# QR code generation
qrcode = { version = "0.14", features = ["svg"] }

# Base64 decoding
base64 = "0.22"

# Error handling
thiserror = "2"
anyhow = "1"

